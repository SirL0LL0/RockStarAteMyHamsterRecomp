# game.toml - Rock Star Ate My Hamster (Amiga, Codemasters 1989), traduzione italiana
# Immagine: chip RAM preparata da game/prepara_immagine.py (gioco a $8100,
# blocco esteso della traduzione a $90000, vettori in testa).

[game]
output_prefix = "rockstar"
annotations = "rockstar_annotations.csv"

# [ram_layout] e' obbligatorio per il ricompilatore. I campi sono pensati per
# il runner Genesis; il runner Amiga usa solo initial_ssp. Gli altri restano
# a 0 finche' non servono.
[ram_layout]
game_mode      = 0x000000
vint_runcount  = 0x000000
vint_routine   = 0x000000
plc_pending    = 0x000000
initial_ssp    = 0x07F000
vbla_stack     = 0x07F000
intr_stack     = 0x07F000
player_object  = 0x000000
level_modes    = []

# Siti di aggancio del gioco (kind = "game_hook"): prima dell'istruzione il
# C generato chiama g_game_spec.instruction_hook (game/rockstar_spec.c).
# $133D6: il bne dopo "cmpi.l #6,$13cee" - la velocita' della musica e'
# riscritta nel codice stesso (move.b d0,$133d1), va riletta dalla memoria.
[[widescreen_site]]
addr = 0x0133D6
kind = "game_hook"
